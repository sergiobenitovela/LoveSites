<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>LoveSites</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<form id="loginForm" class="hide">
  <h1>LoveSites</h1>
  <p class="mute">Solo para nosotros dos</p>
  <input id="em" type="email" placeholder="Email" autocomplete="username" required>
  <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" required>
  <div id="err"></div>
  <button class="btn" style="flex:none">Entrar</button>
</form>

<div id="app" class="hide">
  <div id="map"></div>
  <header><b>ChichiPark</b><button id="out" class="ghost">Salir</button></header>
  <section id="cal">
    <div class="mhead">
      <button id="prev" class="nav" aria-label="Mes anterior">‹</button>
      <div><div id="mtitle"></div><div id="mcount" class="mute"></div></div>
      <button id="next" class="nav" aria-label="Mes siguiente">›</button>
    </div>
    <div class="wd"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
    <div id="grid"></div>
    <div class="card">
      <div id="dayinfo"></div>
      <div class="row"><button id="today" class="btn ghost">Hoy</button><button id="mark" class="btn">♥ Marcar día</button></div>
      <p class="mute hint">Doble toque en un día para marcarlo o quitarlo</p>
    </div>
  </section>
  <nav id="tabs"><button id="tMap" class="on">Mapa</button><button id="tCal">Calendario</button></nav>
  <div id="pinc" class="hide"></div>
  <div id="pickbar" class="hide">
    <b>Mueve el mapa hasta el sitio</b>
    <div class="row"><button class="btn ghost" id="pc">Cancelar</button><button class="btn" id="pok">Confirmar</button></div>
  </div>
  <button id="loc" class="fab" title="Mi ubicación">⌖</button>
  <button id="fab" class="fab" title="Añadir sitio">+</button>
  <div id="sheet" class="sheet hide"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="calendar.js"></script>
<script src="app.js"></script>
</body>
</html>
